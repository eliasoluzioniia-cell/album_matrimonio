<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>progetto-album-matrimonio</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Maschere SVG trasparenti per bordi fumo e pennello (mantengono la nitidezza delle foto) -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none;">
      <defs>
        <!-- Filtro Turbolenza per il Fumo -->
        <filter id="smoke-noise" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Filtro Turbolenza per la Pennellata -->
        <filter id="brush-noise" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="turbulence" baseFrequency="0.08" numOctaves="5" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Maschera Fumo Fotografo -->
        <mask id="smoke-mask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
          <rect width="1" height="1" fill="black" />
          <ellipse cx="0.5" cy="0.5" rx="0.4" ry="0.4" fill="white" filter="url(#smoke-noise)" />
        </mask>

        <!-- Maschera Pennello Trucco -->
        <mask id="brush-mask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
          <rect width="1" height="1" fill="black" />
          <ellipse cx="0.5" cy="0.5" rx="0.42" ry="0.42" fill="white" filter="url(#brush-noise)" />
        </mask>
      </defs>
    </svg>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
