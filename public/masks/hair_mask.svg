<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="hair-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="black" stop-opacity="1" />
      <stop offset="50%" stop-color="black" stop-opacity="0.9" />
      <stop offset="75%" stop-color="black" stop-opacity="0.4" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </radialGradient>
    <filter id="hair-scratch">
      <feTurbulence type="turbulence" baseFrequency="0.085" numOctaves="5" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <rect width="1000" height="1000" fill="transparent" />
  
  <!-- Core Brush Shape -->
  <ellipse cx="500" cy="500" rx="440" ry="440" fill="url(#hair-grad)" filter="url(#hair-scratch)" />
  
  <!-- Fine Scratch Lines -->
  <path d="M150 500 Q 300 200 500 150 Q 700 200 850 500 Q 700 800 500 850 Q 300 800 150 500 Z" fill="none" stroke="black" stroke-width="12" opacity="0.5" filter="url(#hair-scratch)" />
</svg>
