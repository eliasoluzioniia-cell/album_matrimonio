<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="smoke-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="black" stop-opacity="1" />
      <stop offset="40%" stop-color="black" stop-opacity="0.95" />
      <stop offset="70%" stop-color="black" stop-opacity="0.6" />
      <stop offset="90%" stop-color="black" stop-opacity="0.2" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </radialGradient>
    <filter id="smoke-splatter">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="6" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>
  </defs>
  
  <rect width="1000" height="1000" fill="transparent" />
  
  <!-- Core Smoke Shape -->
  <ellipse cx="500" cy="500" rx="420" ry="380" fill="url(#smoke-grad)" filter="url(#smoke-splatter)" />
  
  <!-- Extra Organic Splatters & Smoke Clouds -->
  <circle cx="220" cy="280" r="140" fill="black" opacity="0.4" filter="url(#smoke-splatter)" />
  <circle cx="780" cy="320" r="160" fill="black" opacity="0.4" filter="url(#smoke-splatter)" />
  <circle cx="350" cy="750" r="150" fill="black" opacity="0.3" filter="url(#smoke-splatter)" />
  <circle cx="680" cy="720" r="130" fill="black" opacity="0.3" filter="url(#smoke-splatter)" />
</svg>
